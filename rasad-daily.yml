name: تحليل راصد اليومي

# التشغيل التلقائي — 3:55 عصراً الرياض (12:55 UTC)، الأحد إلى الخميس
on:
  schedule:
    - cron: '55 12 * * 0-4'
  # يسمح بالتشغيل اليدوي من تبويب Actions أيضاً
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # حد أقصى 10 دقائق (وقاية)

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: تجهيز Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت التبعيات
        run: npm install

      - name: تثبيت متصفح Playwright
        run: npx playwright install --with-deps chromium

      - name: تشغيل التحليل
        run: node run.js
        env:
          RASAD_URL: https://rasidn.netlify.app
          RASAD_SHEET: ${{ secrets.RASAD_SHEET }}
          RASAD_CLAUDE: ${{ secrets.RASAD_CLAUDE }}
          RASAD_SAHMK: ${{ secrets.RASAD_SAHMK }}
          RASAD_PROXY: ${{ secrets.RASAD_PROXY }}
          RASAD_OWNER: ${{ secrets.RASAD_OWNER }}
